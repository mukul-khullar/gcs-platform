name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make test lint typecheck

  sitl-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sim/requirements.txt

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ./sim
          file: ./sim/docker/Dockerfile
          build-args: COPTER_TAG=Copter-4.7.2
          tags: gcs-sitl:Copter-4.7.2
          load: true
          cache-from: type=gha,scope=sitl-copter-4.7.2
          cache-to: type=gha,mode=max,scope=sitl-copter-4.7.2

      - name: Install pinned simulator dependencies
        run: python -m pip install -r sim/requirements.txt -r sim/requirements-test.txt

      - name: Start headless SITL
        run: docker compose up --detach --no-build --wait --wait-timeout 60 sitl

      - name: Verify heartbeat
        run: python sim/tools/check_hb.py --timeout 10

      - name: Run repeatability and fault-detection unit checks
        run: python -m pytest sim/tests/test_scenario_runner.py sim/tests/test_faults.py sim/tests/test_sitl_smoke_unit.py -q

      - name: Run SITL smoke scenarios
        run: python sim/tools/sitl_smoke.py --connect udpin:0.0.0.0:14551

      - name: Stop SITL
        if: always()
        run: docker compose down --remove-orphans
