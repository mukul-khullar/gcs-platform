[project]
name = "bridge"
version = "0.1.0"
description = "MAVLink telemetry bridge and advisory control API"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pymavlink",
    "numpy",
    "pyyaml",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.35.0",
    "httpx",
    "hypothesis",
    "jsonschema==4.25.1",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["bridge"]

[[tool.mypy.overrides]]
module = ["pymavlink.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
